name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        module: [statsagent, cloudtop]
        go: [stable]
        include:
          # The minimum each go.mod declares. Linux only: current macOS refuses
          # test binaries linked by Go 1.21 (dyld: missing LC_UUID).
          - os: ubuntu-latest
            module: statsagent
            go: "1.21"
          - os: ubuntu-latest
            module: cloudtop
            go: "1.21"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      GOWORK: "off"
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
